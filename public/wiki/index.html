:root{

<script>

let DATA = null;          // 전체 데이터가 여기 담깁니다
let activeCat = 'all';    // 지금 고른 카테고리
let keyword = '';         // 지금 입력한 검색어

async function load(){
  try{
    const res = await Promise.reject(new Error('데이터는 이 파일 안에 있습니다'));
    if(!res.ok) throw new Error('not ok');
    DATA = await res.json();
  }catch(e){
    // fetch 실패 → 인라인 샘플로 대체
    DATA = JSON.parse(document.getElementById('fallback-data').textContent);
    DATA.meta.fallback = true;
  }
  render();
  route();   // #tech/react 로 바로 들어온 경우 그 문서를 열어 둡니다
}

// HTML 특수문자를 안전하게 바꿔줍니다 (제목에 < > 가 들어와도 깨지지 않게)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  renderStats();
  renderCats();
  renderLegend();
  renderGrid();
  const m = DATA.meta;
  document.getElementById('foot').innerHTML =
    `데이터 기준 ${esc(m.generatedAt)} · v${esc(m.version)}` +
    // fetch 실패 = 샘플, 이라고 단정하면 안 됩니다.
    //   공유본·배포본은 데이터를 파일 안에 통째로 넣고 일부러 fetch 를 안 씁니다.
    //   그것까지 「샘플 모드」라고 말하면 진짜 데이터를 보면서 가짜라는 안내를 읽게 됩니다.
    //   그래서 빌드가 넣어주는 embedded 표시를 함께 봅니다.
    (m.fallback && !m.embedded ? ' · <b>샘플 모드</b> (실제 데이터를 보려면 웹서버로 열어주세요)' : '') +
    ' · 모든 항목은 회원 원문으로 연결됩니다.';
}

function renderLegend(){
  const cohorts = DATA.meta.cohorts;
  const sample = cohorts.map((c, i) =>
    `<figure><i class="${i % 2 === 0 ? 'on' : ''}"></i><figcaption>${esc(c)}</figcaption></figure>`
  ).join('');
  document.getElementById('legend').innerHTML =
    `<span class="key">${sample}</span>` +
    `<span>카드 맨 아래 <b>${cohorts.length}개의 막대</b>는 <b>기수</b>입니다. ` +
    `왼쪽부터 ${esc(cohorts.join(' · '))} 순서이고, ` +
    `<b style="color:var(--green-2)">초록</b>이면 그 기수의 성장일지에 이 기술이 등장했다는 뜻입니다. ` +
    `회색이면 그 기수에는 없었습니다. 막대가 많이 켜져 있을수록 <b>여러 기수에 걸쳐 반복된 기술</b>입니다.</span>`;
}

// 상단 통계 4칸
function renderStats(){
  const techs = DATA.technologies;
  // flatMap: 각 기술의 회원 목록을 하나로 펼친 뒤, Set 으로 중복 제거
  const members = new Set(techs.flatMap(t => (t.members||[]).map(m => m.name)));
  // 글 수는 「기술별 건수의 합」이 아니라 「서로 다른 글의 수」입니다.
  //   합으로 세면 React·TypeScript 에 함께 걸린 글이 두 번 세어져서
  //   어느 실체와도 맞지 않는 숫자가 나옵니다(합 257 · 실제 198).
  //   회원 수는 이미 Set 으로 세고 있었는데 글만 빠져 있었습니다.
  const entries = new Set(techs.flatMap(t => [
    ...(t.topics   || []).flatMap(x => x.entries || []),
    ...(t.problems || []).map(p => p.source).filter(Boolean),
    ...(t.members  || []).flatMap(m => m.evidence || []),
  ])).size;
  const cards = [
    [techs.length,            '정리된 기술'],
    [entries,                 '연결된 성장일지'],   // 고유 글 수. 아카이브 전체(275편)와는 다릅니다
    [members.size,            '기록을 남긴 회원'],
    [DATA.meta.cohorts.length,'기수']
  ];
  document.getElementById('stats').innerHTML =
    cards.map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}

// 카테고리 칩
function renderCats(){
  const cats = [{id:'all', label:'전체'}, ...DATA.categories];
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id===activeCat}">${esc(c.label)}</button>`
  ).join('');
}

// 기술 카드 목록
function renderGrid(){
  const kw = keyword.trim().toLowerCase();
  const list = DATA.technologies.filter(t => {
    if(activeCat !== 'all' && t.category !== activeCat) return false;
    if(!kw) return true;
    // 검색 대상: 기술명 + 요약 + 주제명 + 회원 이름
    const hay = [
      t.name, t.summary,
      ...(t.topics||[]).map(x => x.name),
      ...(t.members||[]).map(x => x.name)
    ].join(' ').toLowerCase();
    return hay.includes(kw);
  });

  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = '<p class="empty">조건에 맞는 기술이 없습니다.</p>';
    return;
  }
  const allCohorts = DATA.meta.cohorts;
  grid.innerHTML = list.map(t => {
    const by = t.stats?.byCohort || {};
    // 어느 기수에서 등장했는지를 작은 막대로 표시
    const spark = allCohorts.map(c =>
      `<i class="${by[c] ? 'on' : ''}" title="${c} · 성장일지 ${by[c] || 0}건"></i>`).join('');
    const cat = DATA.categories.find(c => c.id === t.category);
    return `
      <button class="card" data-slug="${esc(t.slug)}">
        <div class="cat">${esc(cat ? cat.label : t.category)}</div>
        <h3>${esc(t.name)}</h3>
        <p>${esc(t.summary)}</p>
        <div class="nums">
          <span>성장일지 <b>${t.stats?.entries ?? 0}</b></span>
          <span>회원 <b>${t.stats?.members ?? 0}</b></span>
        </div>
        <div class="spark">${spark}</div>
      </button>`;
  }).join('');
}

const BASE_TITLE = document.title;
const BASE_DESC = document.querySelector('meta[name="description"]').content;
let lastFocus = null;   // 패널을 열기 직전에 눌렀던 카드. 닫으면 여기로 돌아갑니다.

function openTech(slug){
  const t = DATA.technologies.find(x => x.slug === slug);
  if(!t) return;

  // 주소창에 지금 보는 문서가 남아 있어야 공유가 되고, 뒤로가기가 동작하고,
  // 검색엔진이 개별 기술을 따로 걸 수 있습니다.
  document.title = `${t.name} — 그로스로그 위키`;
  document.querySelector('meta[name="description"]').content = t.summary || BASE_DESC;

  // entries 배열에서 id 로 원문 정보를 찾아옵니다 (정규화된 구조)
  const entryById = id => (DATA.entries || []).find(e => e.id === id);

  const section = (title, inner) =>
    inner ? `<div class="block"><h4>${title}</h4>${inner}</div>` : '';

  // ① 회원들이 실제로 막힌 지점
  const problems = (t.problems||[]).map(p => `
    <div class="prob">
      <b>${esc(p.title)}</b>
      <p class="s"><em>증상</em> · ${esc(p.symptom)}</p>
      <p class="s"><em>해결</em> · ${esc(p.solution)}</p>
      ${(() => { const e = entryById(p.source);
        return e ? `<p class="s"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.author)} 님 원문 →</a></p>` : ''; })()}
    </div>`).join('');

  // ② 주제별 성장일지
  const topics = (t.topics||[]).map(tp => `
    <li>
      <b>${esc(tp.name)}</b>
      ${(tp.entries||[]).map(id => { const e = entryById(id); return e
        ? `<div class="tp-entry"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
           <span class="tag">${esc(e.cohort)} ${e.round}회차 · ${esc(e.author)}</span></div>` : ''; }).join('')}
    </li>`).join('');

  // ③ 이 기술을 기록한 회원 — Talent Graph 의 씨앗
  //   활용수준 높은 사람부터 나옵니다(정렬은 생성기에서). 사수를 찾으러 온 사람에게는
  //   가나다 순이 아니라 「누가 제일 깊이 다뤄봤나」가 먼저 보여야 합니다.
  //   page 가 있으면 지금 함께하는 회원 — 홈페이지 프로필로 잇고, 말을 걸 수 있는 대상입니다.
  //   없으면 이름만 둡니다. 떠난 분을 눌러 「회원 정보를 찾을 수 없습니다」로 보내지 않기 위해서입니다.
  const members = (t.members||[]).map(m => {
    const ev = (m.evidence||[]).map(id => { const e = entryById(id); return e
      ? `<div class="tp-entry"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
         <span class="tag">${esc(e.cohort)} ${e.round}회차</span></div>` : ''; }).join('');
    // 왼쪽은 「누구이고 얼마나 다뤄봤나」, 오른쪽은 「언제 사람이고 지금 닿을 수 있나」.
    //   활용수준(운영·적용…)과 활동 여부를 둘 다 알약으로 만들면 뜻이 다른데 같아 보입니다.
    //   그래서 수준만 알약으로 두고, 활동 중은 점 하나로 조용히 알립니다.
    const who = m.page
      ? `<a class="mem" href="${esc(m.page)}" target="_blank" rel="noopener">${esc(m.name)}</a>`
      : `<b>${esc(m.name)}</b>`;
    const now = m.page ? `<span class="now" title="지금 함께하는 회원입니다 · 프로필로 이동">활동 중</span> · ` : '';
    return `
    <li>
      <div class="who">
        <span>${who}<span class="tag">${esc(m.level)}</span></span>
        <span class="ev">${now}${esc((m.cohorts||[]).join(' · '))}</span>
      </div>
      ${ev ? `<details class="evd"><summary>근거 ${(m.evidence||[]).length}건</summary>${ev}</details>` : ''}
    </li>`;
  }).join('');

  // ④ 관련 큐레이션
  const curations = (t.curations||[]).map(c => `
    <li>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>` : esc(c.title)}</li>`).join('');

  // 「막힌 지점」이 비어 있는 기술 — 숨기지 않고 왜 없는지를 적습니다.
  //   이 위키는 회원 원문에 실제로 있는 것만 싣습니다. 비어 있다는 건 게으름이 아니라
  //   아직 그 기술로 막힌 기록이 안 쌓였다는 뜻이고, 그걸 그대로 보여주는 게 맞습니다.
  const problemsBlock = problems || `<p class="pending">아직 정리된 것이 없습니다.
    이 위키는 회원이 성장일지에 실제로 쓴 것만 싣기 때문에, 기록이 쌓이면 여기가 채워집니다.</p>`;

  document.getElementById('panel').innerHTML = `
    <button class="close" id="closeBtn" aria-label="닫기">&times;</button>
    <h2 id="panelTitle">${esc(t.name)}</h2>
    <p class="sub">성장일지 ${t.stats?.entries ?? 0}건 · 회원 ${t.stats?.members ?? 0}명</p>

    
    ${section('커뮤니티 안에서', `<p style="margin:0">${esc(t.summary)}</p>`)}
    ${section('회원들이 실제로 막힌 지점', problemsBlock)}
    ${section('주제별 성장일지', topics ? `<ul class="plain">${topics}</ul>` : '')}
    ${section('이 기술을 기록한 회원', members ? `<ul class="plain">${members}</ul>` : '')}
    ${section('관련 큐레이션', curations ? `<ul class="plain">${curations}</ul>` : '')}
  `;
  const sheet = document.getElementById('sheet');
  if(!sheet.classList.contains('open')) lastFocus = document.activeElement;
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';   // 뒤쪽 본문이 같이 스크롤되지 않게
  const panel = document.getElementById('panel');
  panel.scrollTop = 0;                        // 다른 기술로 넘어가도 맨 위에서 시작
  panel.focus();                              // 키보드·스크린리더의 위치를 패널 안으로 옮깁니다
}

function closeSheet(){
  const sheet = document.getElementById('sheet');
  if(!sheet.classList.contains('open')) return;
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  document.title = BASE_TITLE;
  document.querySelector('meta[name="description"]').content = BASE_DESC;
  // 눌렀던 카드로 초점을 되돌립니다. 안 그러면 키보드 사용자가 목록 맨 위로 튕깁니다.
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

const hashOf = () => {
  const m = location.hash.match(/^#tech\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
};
const goTo = slug => { location.hash = slug ? 'tech/' + encodeURIComponent(slug) : ''; };

function route(){
  const slug = hashOf();
  if(slug) openTech(slug); else closeSheet();
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(chip){ activeCat = chip.dataset.cat; renderCats(); renderGrid(); return; }

  // 카드는 직접 열지 않고 주소를 바꿉니다. 여는 일은 route() 한 곳에서만 합니다.
  //   (직접 열기 + 주소 바꾸기를 둘 다 하면 두 번 열려서 스크롤·초점이 어긋납니다)
  const card = e.target.closest('.card');
  if(card){ lastFocus = card; goTo(card.dataset.slug); return; }

  if(e.target.closest('#closeBtn') || e.target.id === 'sheet') goTo(null);
});

window.addEventListener('hashchange', route);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ goTo(null); return; }

  // 초점 가두기 — 패널이 열려 있는 동안 Tab 이 뒤쪽 카드 목록으로 새어 나가지 않게.
  //   모달을 열어 놓고 Tab 을 눌렀는데 보이지 않는 곳으로 초점이 가면
  //   키보드 사용자는 자기가 어디 있는지 알 수 없습니다.
  if(e.key !== 'Tab') return;
  const sheet = document.getElementById('sheet');
  if(!sheet.classList.contains('open')) return;

  const panel = document.getElementById('panel');
  const f = [...panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];

  if(e.shiftKey && (document.activeElement === first || document.activeElement === panel)){
    e.preventDefault(); last.focus();
  }else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
});

document.getElementById('q').addEventListener('input', e => {
  keyword = e.target.value;
  renderGrid();
});

load();
</script>
</body>
</html>
